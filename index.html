<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wood Classics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Handcrafted furniture, cabinetry, and custom builds made to last."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <nav class="site-nav">
      <div class="nav">
        <img src="images/logo.png" alt="Wood Classics" class="logo" />
        <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
        <div class="nav-links">
          <a href="index.html" class="nav-link">Home</a>
          <a href="portfolio.html" class="nav-link">Portfolio</a>
          <a href="about.html" class="nav-link">About</a>
          <a href="index.html#contact" class="nav-link">Contact</a>
        </div>
      </div>
    </nav>

    <header class="site-header">
      <div class="hero"></div>
    </header>

    <main class="container">
      <section id="contact" class="card">
        <div class="section-head">
          <div>
            <h2>Contact</h2>
            <p class="muted">
              Let me know what you’re looking to build. I’ll get back to you
              soon.
            </p>
          </div>
        </div>

        <form name="contact" class="form" method="POST" data-netlify="true" enctype="multipart/form-data">
          <input type="hidden" name="form-name" value="contact" />
          <input type="hidden" name="subject" value="Wood Classics Contact Request - %{submissionId}" />

          <div class="grid">
            <label class="field">
              <span>Name <span style="color:var(--accent)">*</span></span>
              <input type="text" name="name" autocomplete="name" required />
            </label>
            <label class="field">
              <span>Email <span style="color:var(--accent)">*</span></span>
              <input type="email" name="email" autocomplete="email" required />
            </label>
            <label class="field">
              <span>Location</span>
              <input type="text" name="location" autocomplete="address-level2" />
            </label>
            <label class="field">
              <span>Budget</span>
              <input type="text" name="budget" />
            </label>
          </div>

          <label class="field">
            <span>Project Description</span>
            <textarea name="description" rows="5" required></textarea>
          </label>

          <label class="field">
            <span>Projected Due Date</span>
            <input type="date" name="due-date" id="due-date" />
          </label>

          <label class="field">
            <span>Image / Drawing / Sketch</span>
            <input type="file" name="attachment" accept="image/*,.pdf" />
          </label>

          <div style="display:flex;align-items:center;gap:1rem;margin-top:1rem">
            <button class="btn btn-primary" type="submit" style="margin-top:0">Send message</button>
          </div>
        </form>
      </section>

      <div style="display:flex;justify-content:center">
      <section class="card" style="display:inline-flex;flex-direction:column;align-items:center;text-align:center;font-size:1.15rem">
        <p style="margin:0;font-weight:700">Andy Larsen, Owner</p>
        <p style="margin:0"><a href="tel:3852361283" style="color:inherit">(385) 236-1283</a></p>
        <p style="margin:0"><a href="mailto:andy.woodclassics@gmail.com" style="color:inherit">andy.woodclassics@gmail.com</a></p>
      </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <p class="muted">© 2026 Wood Classics</p>
        <p class="muted">Made in Utah</p>
      </div>
    </footer>

    <script>document.querySelector('.nav-toggle').addEventListener('click',function(){document.querySelector('.nav-links').classList.toggle('open');});
document.getElementById('due-date').min=new Date().toISOString().split('T')[0];document.querySelector('input[type="date"]').addEventListener('click',function(){this.showPicker();});</script>
  </body>
