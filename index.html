    <section id="contact" class="card">
      <div class="section-head">
        <div>
          <h2>Contact</h2>
          <p class="muted">Tell us what you’re looking to build. We’ll get back to you soon.</p>
        </div>
        <div class="contact-meta">
          <!-- Optional: add phone/email if you want -->
          <!-- <div><span class="meta-label">Phone</span><br>(555) 555-5555</div> -->
          <!-- <div><span class="meta-label">Email</span><br>hello@smithwoodwork.com</div> -->
        </div>
      </div>

      <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="form">
        <input type="hidden" name="form-name" value="contact" />

        <!-- Honeypot anti-spam -->
        <p class="hidden">
          <label>Don’t fill this out: <input name="bot-field" /></label>
        </p>

        <div class="grid">
          <label class="field">
            <span>Name</span>
            <input type="text" name="name" autocomplete="name" required />
          </label>

          <label class="field">
            <span>Email</span>
            <input type="email" name="email" autocomplete="email" required />
          </label>
        </div>

        <label class="field">
          <span>Message</span>
          <textarea name="message" rows="6" required placeholder="Tell us about your project (size, wood type, timeline, budget range if you have one)…"></textarea>
        </label>

        <button class="btn btn-primary" type="submit">Send message</button>
      </form>
    </section>

  </main>

  <footer class="footer">
